name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: youtube_studio_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d youtube_studio_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=youtube_studio_ai;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/src/YoutubeStudio.Api/YoutubeStudio.Api.csproj
      - run: dotnet build backend/src/YoutubeStudio.Api/YoutubeStudio.Api.csproj --no-restore
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Apply EF Core migrations
        run: dotnet ef database update --project backend/src/YoutubeStudio.Api/YoutubeStudio.Api.csproj
      - name: Run backend tests
        run: |
          set -o pipefail
          dotnet test backend/tests/YoutubeStudio.Api.Tests/YoutubeStudio.Api.Tests.csproj \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed" \
            2>&1 | tee backend-test.log
      - name: Upload backend test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: |
            **/test-results.trx
            backend-test.log
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
