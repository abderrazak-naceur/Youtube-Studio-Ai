name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: youtube_studio_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d youtube_studio_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=youtube_studio_ai;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/src/YoutubeStudio.Api/YoutubeStudio.Api.csproj
      - run: dotnet build backend/src/YoutubeStudio.Api/YoutubeStudio.Api.csproj --no-restore
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Verify EF model snapshot is current
        shell: bash
        run: |
          set -euo pipefail
          project=backend/src/YoutubeStudio.Api/YoutubeStudio.Api.csproj
          if dotnet ef migrations has-pending-model-changes --project "$project" --no-build; then
            echo 'EF Core model snapshot is current.'
          else
            echo 'EF Core reports pending model changes. Generating a CI-only migration diff.'
            rm -rf /tmp/ef-model-diff
            mkdir -p /tmp/ef-model-diff
            if dotnet ef migrations add CiModelDiff \
              --project "$project" \
              --no-build \
              --output-dir /tmp/ef-model-diff; then
              echo 'Generated EF model diff:'
              cat /tmp/ef-model-diff/*_CiModelDiff.cs
              echo 'EF model drift must be resolved in the committed migration snapshot.'
            else
              echo 'EF could not generate the diagnostic migration; printing the original pending-model check again.'
              dotnet ef migrations has-pending-model-changes --project "$project" --no-build || true
            fi
            exit 1
          fi
      - name: Apply EF Core migrations
        run: dotnet ef database update --project backend/src/YoutubeStudio.Api/YoutubeStudio.Api.csproj --no-build
      - name: Verify EF Core migrations and production schema
        shell: bash
        run: |
          set -euo pipefail
          migrations=$(dotnet ef migrations list --project backend/src/YoutubeStudio.Api/YoutubeStudio.Api.csproj --no-build)
          grep -q '20260911120000_InitialMvp' <<<"$migrations"
          grep -q '20260911143000_AddVideoProjects' <<<"$migrations"
          grep -q '20260912001000_AddProductionPipeline' <<<"$migrations"
          grep -q '20260912130000_AddResearchProjects' <<<"$migrations"
          grep -q '20260912134000_AddResearchSources' <<<"$migrations"
          grep -q '20260912145000_AddResearchEvidence' <<<"$migrations"
          grep -q '20260912152000_AddResearchClaims' <<<"$migrations"

          PGPASSWORD=postgres psql \
            --host=localhost \
            --port=5432 \
            --username=postgres \
            --dbname=youtube_studio_ai \
            --command='SELECT to_regclass('"'"'public.workspaces'"'"'), to_regclass('"'"'public.video_projects'"'"'), to_regclass('"'"'public.production_jobs'"'"'), to_regclass('"'"'public.production_artifacts'"'"'), to_regclass('"'"'public.research_projects'"'"'), to_regclass('"'"'public.research_sources'"'"'), to_regclass('"'"'public.research_evidence'"'"'), to_regclass('"'"'public.research_claims'"'"'), to_regclass('"'"'public.research_claim_evidence'"'"');' \
            --tuples-only \
            --no-align | tee migration-schema.txt

          grep -q 'workspaces|video_projects|production_jobs|production_artifacts|research_projects|research_sources|research_evidence|research_claims|research_claim_evidence' migration-schema.txt
      - name: Verify end-to-end video production loop
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build --project backend/src/YoutubeStudio.Api/YoutubeStudio.Api.csproj --urls http://127.0.0.1:5000 > api-e2e.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5000/health >/dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat api-e2e.log
              exit 1
            fi
            sleep 1
          done

          curl --silent --fail http://127.0.0.1:5000/health >/dev/null

          workspace_response=$(curl --silent --fail \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI E2E Workspace"}' \
            http://127.0.0.1:5000/api/v1/workspaces)
          workspace_id=$(jq -r '.id' <<<"$workspace_response")
          test -n "$workspace_id" && test "$workspace_id" != "null"

          project_response=$(curl --silent --fail \
            -H 'Content-Type: application/json' \
            -d "{\"workspaceId\":\"$workspace_id\",\"channelId\":null,\"prompt\":\"Create a short explainer about how AI helps creators plan better videos.\"}" \
            http://127.0.0.1:5000/api/v1/video-projects)
          project_id=$(jq -r '.id' <<<"$project_response")
          test -n "$project_id" && test "$project_id" != "null"

          curl --silent --fail \
            -X POST \
            http://127.0.0.1:5000/api/v1/video-projects/$project_id/start >/dev/null

          completed=false
          for attempt in {1..60}; do
            status_response=$(curl --silent --fail http://127.0.0.1:5000/api/v1/video-projects/$project_id)
            status=$(jq -r '.status' <<<"$status_response")
            if [ "$status" = "Completed" ]; then
              completed=true
              break
            fi
            if [ "$status" = "Failed" ]; then
              echo "$status_response"
              cat api-e2e.log
              exit 1
            fi
            sleep 1
          done

          test "$completed" = true

          artifacts_response=$(curl --silent --fail http://127.0.0.1:5000/api/v1/video-projects/$project_id/artifacts)
          artifact_count=$(jq 'length' <<<"$artifacts_response")
          test "$artifact_count" -ge 9

          for artifact_type in Research Script ScenePlan Voice Visual MusicSfx Captions Render Qa; do
            jq -e --arg type "$artifact_type" 'any(.[]; .type == $type)' <<<"$artifacts_response" >/dev/null
          done
      - name: Restore backend tests
        run: dotnet restore backend/tests/YoutubeStudio.Api.Tests/YoutubeStudio.Api.Tests.csproj
      - name: Run backend tests
        run: |
          set -o pipefail
          dotnet test backend/tests/YoutubeStudio.Api.Tests/YoutubeStudio.Api.Tests.csproj \
            --no-restore \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed" \
            2>&1 | tee backend-test.log
      - name: Upload backend test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: |
            **/test-results.trx
            backend-test.log
            api-e2e.log
            migration-schema.txt
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
