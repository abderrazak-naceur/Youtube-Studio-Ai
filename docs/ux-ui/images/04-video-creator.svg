      <text x="840" y="145" fill="#8ea3bd">4. Voice</text>
      <text x="1020" y="145" fill="#8ea3bd">5. Generate</text>
    </g>
    <rect x="270" y="190" width="480" height="500" rx="18" fill="#0e1d30" stroke="#1e3550"/>
    <text x="300" y="230" fill="#ffffff" font-size="21" font-weight="700">Video Idea</text>
    <text x="300" y="270" fill="#a9bad0" font-size="15">The Future of AI in 2026</text>
    <text x="300" y="320" fill="#ffffff" font-size="18" font-weight="700">Style &amp; Tone</text>
    <rect x="300" y="345" width="145" height="45" rx="9" fill="#633cff"/>
    <text x="325" y="373" fill="#ffffff" font-size="14">Professional</text>
    <rect x="300" y="420" width="190" height="100" rx="12" fill="#182b43"/>
