      <text x="30" y="160">Opportunities</text>
      <text x="30" y="205">Research</text>
      <text x="30" y="250" fill="#ffffff" font-weight="700">Video Creator</text>
      <text x="30" y="295">Production</text>
      <text x="30" y="340">Publishing</text>
      <text x="30" y="385">Analytics</text>
      <text x="30" y="430">Revenue</text>
      <text x="30" y="475">AI Agents</text>
    </g>
    <text x="270" y="70" fill="#ffffff" font-size="32" font-weight="700">Video Creator</text>
    <rect x="270" y="110" width="1030" height="55" rx="12" fill="#12243a"/>
    <g font-size="15">
      <text x="300" y="145" fill="#ffffff" font-weight="700">1. Idea</text>
      <text x="480" y="145" fill="#8ea3bd">2. Script</text>
