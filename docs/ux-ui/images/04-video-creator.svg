      <text x="810" y="280">1. Hook (0:00 - 0:30)</text>
      <text x="810" y="325">AI is changing work faster than ever.</text>
      <text x="810" y="370">2. Introduction (0:30 - 1:30)</text>
      <text x="810" y="415">The biggest opportunities for creators.</text>
      <text x="810" y="460">3. Main Content (1:30 - 8:00)</text>
      <text x="810" y="505">Tools, jobs, predictions and practical examples.</text>
      <text x="810" y="550">4. Conclusion (8:00 - 10:00)</text>
    </g>
    <rect x="810" y="610" width="300" height="48" rx="10" fill="#633cff"/>
