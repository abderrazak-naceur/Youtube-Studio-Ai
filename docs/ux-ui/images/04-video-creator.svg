<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Studio AI — Video Creator</title>
  <desc id="desc">Dark SaaS interface for creating a YouTube video from idea to script, visuals, voice and generation.</desc>
  <rect width="1440" height="900" fill="#07111f"/>
  <rect width="230" height="900" fill="#0b1728"/>
